name: Nightly

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  meta:
    runs-on: windows-latest
    outputs:
      should-build: ${{ steps.check.outputs.build }}
      build-version: ${{ steps.v.outputs.build-version }}
      base-prefix: ${{ steps.v.outputs.base-prefix }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for new commits
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse --short HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT

          $body = ''
          try { $body = (gh release view nightly --json body --jq .body 2>$null) -join "`n" } catch { }
          $global:LASTEXITCODE = 0

          $previous = ''
          if ($body -match '(?m)^<!-- nightly-sha:([0-9a-f]+) -->\r?$') {
            $previous = $Matches[1]
          }

          if ($previous -eq $sha -and $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            Write-Host "HEAD ($sha) is already the published nightly — skipping."
            "build=false" >> $env:GITHUB_OUTPUT
          } else {
            "build=true" >> $env:GITHUB_OUTPUT
          }

      - name: Resolve version
        id: v
        if: steps.check.outputs.build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $sha = '${{ steps.check.outputs.sha }}'
          $date = (Get-Date).ToUniversalTime().AddHours(8).ToString('yyyyMMdd')
          $buildVersion = "$appVersion-nightly.$date"

          "build-version=$buildVersion" >> $env:GITHUB_OUTPUT
          "base-prefix=AniMikan-v${appVersion}_${sha}-nightly.${date}" >> $env:GITHUB_OUTPUT

  build:
    needs: meta
    if: needs.meta.outputs.should-build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            family: windows
            platform: windows-x64
          - os: ubuntu-latest
            family: linux
            platform: linux-x64
          - os: ubuntu-latest
            family: android
            platform: android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: Build and package
        if: matrix.family == 'windows'
        uses: ./.github/actions/build-windows
        with:
          version: ${{ needs.meta.outputs.build-version }}
          base-name: ${{ needs.meta.outputs.base-prefix }}-${{ matrix.platform }}

      - name: Build and package
        if: matrix.family == 'linux'
        uses: ./.github/actions/build-linux
        with:
          version: ${{ needs.meta.outputs.build-version }}
          base-name: ${{ needs.meta.outputs.base-prefix }}-${{ matrix.platform }}

      - name: Build and package
        if: matrix.family == 'android'
        uses: ./.github/actions/build-android
        with:
          version: ${{ needs.meta.outputs.build-version }}
          base-name: ${{ needs.meta.outputs.base-prefix }}-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error

  publish:
    needs: [meta, build]
    if: needs.meta.outputs.should-build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render changelog
        id: notes
        uses: ./.github/actions/changelog
        with:
          args: --unreleased
          header: |
            **Nightly build** — `${{ needs.meta.outputs.build-version }}` (`${{ needs.meta.outputs.sha }}`)

            Built automatically from `main` and untested. For a stable build, use the [latest release](https://github.com/${{ github.repository }}/releases/latest).

            <!-- nightly-sha:${{ needs.meta.outputs.sha }} -->

      - name: Publish
        uses: ./.github/actions/publish-release
        with:
          tag: nightly
          title: Nightly ${{ needs.meta.outputs.build-version }}
          notes-file: ${{ steps.notes.outputs.notes-path }}
          asset-prefix: ${{ needs.meta.outputs.base-prefix }}
          version: ${{ needs.meta.outputs.build-version }}
          sha: ${{ needs.meta.outputs.sha }}
          nightly: 'true'
