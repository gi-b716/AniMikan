name: Nightly

# Rolls a single `nightly` prerelease forward instead of opening a new release
# every night: the previous night's assets are deleted once the new ones are up.
# Only one nightly per day, because the version string carries the date and two
# builds sharing it would look identical to the in-app updater.

on:
  schedule:
    # 01:17 UTC — 09:17 in Beijing, so the date stamped into the version agrees
    # with the local calendar day for the maintainer. Off the hour to avoid the
    # top-of-hour rush.
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  meta:
    runs-on: windows-latest
    outputs:
      should-build: ${{ steps.check.outputs.build }}
      build-version: ${{ steps.v.outputs.build-version }}
      base-prefix: ${{ steps.v.outputs.base-prefix }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for new commits
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse --short HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT

          # The published commit is recorded in a marker the rendered release
          # page hides, which survives every edit of the notes.
          $body = (gh release view nightly --json body --jq .body 2>$null) -join "`n"
          $previous = ''
          if ($body -and $body -match '(?m)^<!-- nightly-sha:([0-9a-f]+) -->\r?$') {
            $previous = $Matches[1]
          }

          if ($previous -eq $sha -and $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            Write-Host "HEAD ($sha) is already the published nightly — skipping."
            "build=false" >> $env:GITHUB_OUTPUT
          } else {
            "build=true" >> $env:GITHUB_OUTPUT
          }

      - name: Resolve version
        id: v
        if: steps.check.outputs.build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $sha = '${{ steps.check.outputs.sha }}'
          $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')

          # Matches the nightly convention: a prerelease of the version
          # currently in development, which sorts below that release and above
          # the one before it.
          $buildVersion = "$appVersion-nightly.$date"

          "build-version=$buildVersion" >> $env:GITHUB_OUTPUT
          "base-prefix=AniMikan-v${appVersion}_${sha}-nightly.${date}" >> $env:GITHUB_OUTPUT

  build:
    needs: meta
    if: needs.meta.outputs.should-build == 'true'
    strategy:
      # One platform failing should still let the other finish, so a rerun only
      # has to redo what actually broke.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            family: windows
            platform: windows-x64
          - os: ubuntu-latest
            family: linux
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: Build and package
        if: matrix.family == 'windows'
        uses: ./.github/actions/build-windows
        with:
          version: ${{ needs.meta.outputs.build-version }}
          base-name: ${{ needs.meta.outputs.base-prefix }}-${{ matrix.platform }}

      - name: Build and package
        if: matrix.family == 'linux'
        uses: ./.github/actions/build-linux
        with:
          version: ${{ needs.meta.outputs.build-version }}
          base-name: ${{ needs.meta.outputs.base-prefix }}-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error

  publish:
    needs: [meta, build]
    if: needs.meta.outputs.should-build == 'true'
    runs-on: windows-latest
    env:
      BUILD_VERSION: ${{ needs.meta.outputs.build-version }}
      BASE_PREFIX: ${{ needs.meta.outputs.base-prefix }}
      SHA: ${{ needs.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the whole history to render the changelog.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render changelog
        id: notes
        uses: ./.github/actions/changelog
        with:
          args: --unreleased
          header: |
            **Nightly build** — `${{ needs.meta.outputs.build-version }}` (`${{ needs.meta.outputs.sha }}`)

            Built automatically from `main` and untested. For a stable build, use the [latest release](https://github.com/${{ github.repository }}/releases/latest).

            <!-- nightly-sha:${{ needs.meta.outputs.sha }} -->

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.notes-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:BUILD_VERSION
          $sha = $env:SHA
          $prefix = $env:BASE_PREFIX

          # Keep in sync with the matrix in the build job.
          $assets = @(
            @{ Name = "$prefix-windows-x64-setup.exe"; Label = "AniMikan v${version}+${sha} (nightly, For windows_x64) Setup.exe" }
            @{ Name = "$prefix-windows-x64.zip";       Label = "AniMikan v${version}+${sha} (nightly, For windows_x64).zip" }
            @{ Name = "$prefix-linux-x64.tar.gz";      Label = "AniMikan v${version}+${sha} (nightly, For linux_x64).tar.gz" }
          )

          $paths = @()
          foreach ($a in $assets) {
            $p = Join-Path 'dist' $a.Name
            if (-not (Test-Path $p)) { throw "The build matrix did not produce $($a.Name)" }
            $paths += $p
          }

          $repo = $env:GITHUB_REPOSITORY

          gh release view nightly 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create nightly --prerelease --title 'Nightly' --notes 'Nightly builds of the main branch.'
          }

          # New assets first, so the release is never left empty if a step below
          # fails. Deleting happens last for the same reason.
          gh release upload nightly $paths --clobber
          gh release edit nightly --title "Nightly $version" --notes-file $env:NOTES

          $keep = @($assets | ForEach-Object { $_.Name })
          foreach ($asset in (gh release view nightly --json assets --jq '.assets[].name')) {
            if ($keep -notcontains $asset) {
              gh release delete-asset nightly $asset --yes
              Write-Host "removed stale asset $asset"
            }
          }

          foreach ($a in $assets) {
            $id = gh api "repos/$repo/releases/tags/nightly" `
              --jq ".assets[] | select(.name == ""$($a.Name)"") | .id"
            if (-not $id) { throw "Asset $($a.Name) missing from the nightly release" }
            gh api -X PATCH "repos/$repo/releases/assets/$id" -f "label=$($a.Label)" | Out-Null
            Write-Host "$($a.Name) -> $($a.Label)"
          }
