name: Release

# Publishing is driven by pushing a tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match `version:` in pubspec.yaml, otherwise the run fails in the
# meta job rather than shipping binaries that report the wrong version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: v
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not a vX.Y.Z release tag."
          }
          $version = $tag -replace '^v', ''
          $pubspec = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          if ($pubspec -ne $version) {
            throw "Tag $tag says $version but pubspec.yaml says $pubspec. Set pubspec.yaml to $version and retag."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "sha=$((git rev-parse --short HEAD).Trim())" >> $env:GITHUB_OUTPUT

  build:
    needs: meta
    strategy:
      # One platform failing should still let the other finish, so a rerun only
      # has to redo what actually broke.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            family: windows
            platform: windows-x64
          - os: ubuntu-latest
            family: linux
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: Build and package
        if: matrix.family == 'windows'
        uses: ./.github/actions/build-windows
        with:
          version: ${{ needs.meta.outputs.version }}
          base-name: AniMikan-v${{ needs.meta.outputs.version }}_${{ needs.meta.outputs.sha }}-${{ matrix.platform }}

      - name: Build and package
        if: matrix.family == 'linux'
        uses: ./.github/actions/build-linux
        with:
          version: ${{ needs.meta.outputs.version }}
          base-name: AniMikan-v${{ needs.meta.outputs.version }}_${{ needs.meta.outputs.sha }}-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SHA: ${{ needs.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the whole history to render the changelog.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render changelog
        id: notes
        uses: ./.github/actions/changelog
        with:
          args: --latest

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          NOTES: ${{ steps.notes.outputs.notes-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $sha = $env:SHA
          $prefix = "AniMikan-v${version}_${sha}"

          # Keep in sync with the matrix in the build job.
          $assets = @(
            @{ Name = "$prefix-windows-x64-setup.exe"; Label = "AniMikan v${version}+${sha} (For windows_x64) Setup.exe" }
            @{ Name = "$prefix-windows-x64.zip";       Label = "AniMikan v${version}+${sha} (For windows_x64).zip" }
            @{ Name = "$prefix-linux-x64.tar.gz";      Label = "AniMikan v${version}+${sha} (For linux_x64).tar.gz" }
          )

          $paths = @()
          foreach ($a in $assets) {
            $p = Join-Path 'dist' $a.Name
            if (-not (Test-Path $p)) { throw "The build matrix did not produce $($a.Name)" }
            $paths += $p
          }

          # Re-running on an existing tag replaces its assets instead of failing.
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists — replacing its assets."
            foreach ($asset in (gh release view $env:TAG --json assets --jq '.assets[].name')) {
              gh release delete-asset $env:TAG $asset --yes
            }
            gh release edit $env:TAG --title "AniMikan v$version" --notes-file $env:NOTES --latest
          } else {
            gh release create $env:TAG --title "AniMikan v$version" --notes-file $env:NOTES --latest
          }
          gh release upload $env:TAG $paths --clobber

          # GitHub rewrites asset filenames containing spaces, '+', parentheses
          # and friends, so the download name is kept boring and the friendly
          # name the user actually reads goes in the asset label.
          $repo = $env:GITHUB_REPOSITORY
          foreach ($a in $assets) {
            $id = gh api "repos/$repo/releases/tags/$env:TAG" `
              --jq ".assets[] | select(.name == ""$($a.Name)"") | .id"
            if (-not $id) { throw "Asset $($a.Name) missing from release $env:TAG" }
            gh api -X PATCH "repos/$repo/releases/assets/$id" -f "label=$($a.Label)" | Out-Null
            Write-Host "$($a.Name) -> $($a.Label)"
          }
