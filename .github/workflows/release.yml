name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: v
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not a vX.Y.Z release tag."
          }
          $version = $tag -replace '^v', ''
          $pubspec = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          if ($pubspec -ne $version) {
            throw "Tag $tag says $version but pubspec.yaml says $pubspec. Set pubspec.yaml to $version and retag."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "sha=$((git rev-parse --short HEAD).Trim())" >> $env:GITHUB_OUTPUT

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            family: windows
            platform: windows-x64
          - os: ubuntu-latest
            family: linux
            platform: linux-x64
          - os: ubuntu-latest
            family: android
            platform: android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: Build and package
        if: matrix.family == 'windows'
        uses: ./.github/actions/build-windows
        with:
          version: ${{ needs.meta.outputs.version }}
          base-name: AniMikan-v${{ needs.meta.outputs.version }}_${{ needs.meta.outputs.sha }}-${{ matrix.platform }}

      - name: Build and package
        if: matrix.family == 'linux'
        uses: ./.github/actions/build-linux
        with:
          version: ${{ needs.meta.outputs.version }}
          base-name: AniMikan-v${{ needs.meta.outputs.version }}_${{ needs.meta.outputs.sha }}-${{ matrix.platform }}

      - name: Build and package
        if: matrix.family == 'android'
        uses: ./.github/actions/build-android
        with:
          version: ${{ needs.meta.outputs.version }}
          base-name: AniMikan-v${{ needs.meta.outputs.version }}_${{ needs.meta.outputs.sha }}-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render changelog
        id: notes
        uses: ./.github/actions/changelog
        with:
          args: --latest

      - name: Publish
        uses: ./.github/actions/publish-release
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          title: AniMikan v${{ needs.meta.outputs.version }}
          notes-file: ${{ steps.notes.outputs.notes-path }}
          asset-prefix: AniMikan-v${{ needs.meta.outputs.version }}_${{ needs.meta.outputs.sha }}
          version: ${{ needs.meta.outputs.version }}
          sha: ${{ needs.meta.outputs.sha }}
