name: Build AniMikan for Windows
description: >-
  Builds the Flutter Windows release, packs the portable zip, compiles the Inno
  Setup installer and renders a changelog. The release and nightly channels
  both go through here so they ship byte-identical artifacts.

inputs:
  version:
    description: Version stamped into the exe, e.g. 0.1.0 or 0.1.0-nightly.20260916.
    required: true
  base-name:
    description: Filename stem shared by the zip and the installer, without extension.
    required: true
  changelog-args:
    description: git-cliff range selector, e.g. --latest for a tag or --unreleased for nightly.
    required: false
    default: --latest
  notes-header:
    description: Markdown prepended to the rendered changelog.
    required: false
    default: ''
  dist-dir:
    description: Directory the artifacts are written to.
    required: false
    default: dist

outputs:
  setup-path:
    description: Absolute path to the compiled installer.
    value: ${{ steps.package.outputs.setup-path }}
  zip-path:
    description: Absolute path to the portable zip.
    value: ${{ steps.package.outputs.zip-path }}

runs:
  using: composite
  steps:
    - name: Build
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        APP_VERSION: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        flutter pub get
        flutter analyze
        flutter build windows --release "--build-name=$env:APP_VERSION"

    - name: Package
      id: package
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        APP_VERSION: ${{ inputs.version }}
        BASE_NAME: ${{ inputs.base-name }}
      run: |
        $ErrorActionPreference = 'Stop'
        $buildDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
        if (-not (Test-Path "$buildDir/animikan.exe")) {
          throw "Flutter did not produce $buildDir/animikan.exe"
        }

        $dist = Join-Path $env:GITHUB_WORKSPACE ${{ inputs.dist-dir }}
        New-Item -ItemType Directory -Force -Path $dist | Out-Null

        $stage = Join-Path $env:RUNNER_TEMP 'portable'
        Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "$stage/AniMikan" | Out-Null
        Copy-Item -Path "$buildDir/*" -Destination "$stage/AniMikan" -Recurse -Force

        $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
        if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
        if (-not (Test-Path $sevenZip)) { throw '7z.exe not found on this runner.' }

        $zip = Join-Path $dist "$env:BASE_NAME.zip"
        Push-Location $stage
        try {
          & $sevenZip a -tzip -bso0 -bsp0 $zip 'AniMikan'
          if ($LASTEXITCODE -ne 0) { throw "7z exited with $LASTEXITCODE" }
        } finally { Pop-Location }

        $findIscc = {
          @(
            Get-ChildItem -Path @($env:ProgramFiles, ${env:ProgramFiles(x86)}) `
              -Directory -Filter 'Inno Setup *' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'ISCC.exe' }
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
        }
        $iscc = & $findIscc
        if (-not $iscc) {
          choco install innosetup -y --no-progress | Out-Null
          $iscc = & $findIscc
        }
        if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) not found.' }
        Write-Host "using $iscc"

        $parts = ($env:APP_VERSION -split '-')[0] -split '\.'
        $quad = "$($parts[0]).$($parts[1]).$($parts[2]).0"

        & $iscc `
          "/DAppVersion=$env:APP_VERSION" `
          "/DAppVersionQuad=$quad" `
          "/DAppBuildDir=$buildDir" `
          "/DOutputDir=$dist" `
          "/DOutputBaseFilename=$env:BASE_NAME-setup" `
          'installer/animikan.iss'
        if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }

        $setup = Join-Path $dist "$env:BASE_NAME-setup.exe"
        if (-not (Test-Path $setup)) { throw "Installer was not produced at $setup" }

        "setup-path=$setup" >> $env:GITHUB_OUTPUT
        "zip-path=$zip" >> $env:GITHUB_OUTPUT
        Write-Host "setup: $setup"
        Write-Host "zip:   $zip"
